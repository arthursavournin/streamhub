# Publie StreamHub sur GitHub Pages, avec l'index des épisodes TF1+ et M6+, ceux des chaînes de Canal+ et le top du moment
# (scripts/build_episode_index.py).
# Tourne à chaque modification du code et toutes les 6 heures, pour suivre les nouveaux épisodes et titres.
name: Publier StreamHub

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Droits minimaux par défaut ; seule la publication (deploy) peut écrire sur GitHub Pages (audit de sécurité, F5).
# Actions épinglées par empreinte de commit (et non par étiquette, qui peut être déplacée) ; version en commentaire.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Copier le site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude 'extension' --exclude 'relay' --exclude 'ios' --exclude 'supabase' --exclude 'CLAUDE.md' --exclude '_site' ./ _site/
          # Le script « reprise après connexion » s'installe depuis le site (Safari + appli Userscripts)
          cp extension/streamhub-reprise.user.js _site/

      - name: Indexer les épisodes TF1+ et M6+, et le catalogue HBO Max de Canal+
        # Si une plateforme ne répond pas, le site est quand même publié : StreamHub renverra vers sa page
        run: python3 scripts/build_episode_index.py _site/data || echo "::warning::Index incomplet"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # GitHub met en pause les tâches planifiées d'un dépôt public sans commit depuis 60 jours.
  # Réactiver la tâche à chaque passage planifié remet ce compteur à zéro : l'index des épisodes
  # continue de se mettre à jour même si le code ne bouge plus.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      # Comptes StreamHub : le plan gratuit de Supabase met le projet en pause après 7 jours sans activité.
      # Une petite requête (fonction keepalive, qui ne lit rien) toutes les 6 heures le garde éveillé.
      # Clé publique (la même que dans account.js).
      - name: Garder Supabase éveillé
        run: |
          curl -fsS -X POST "https://bfcmqdvztmkpqwamwejp.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_RB_4r6Da9y2SLQPjavQXVA_w2Brn3LI" -H "content-type: application/json" -d '{}' \
            || echo "::warning::Supabase ne répond pas"
