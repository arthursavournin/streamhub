<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a30"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea2ff"/>
      <stop offset="1" stop-color="#1d4fd6"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccbff"/>
      <stop offset="1" stop-color="#4f8ff7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6ff"/>
      <stop offset="1" stop-color="#7fb5ff"/>
    </linearGradient>
    <!-- Les couches claires sont découpées dans le triangle intérieur : un liseré bleu les entoure -->
    <clipPath id="tri"><path d="M150 112 L150 400 L402 256 Z" stroke="#000" stroke-width="12" stroke-linejoin="round"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Triangle « lecture » aux coins arrondis (trait épais, jointures rondes) -->
  <path d="M150 112 L150 400 L402 256 Z" fill="url(#play)" stroke="url(#play)" stroke-width="44" stroke-linejoin="round"/>
  <g clip-path="url(#tri)">
    <rect x="232" y="150" width="200" height="212" rx="26" fill="url(#mid)"/>
    <rect x="296" y="182" width="150" height="148" rx="22" fill="url(#front)"/>
  </g>
</svg>
